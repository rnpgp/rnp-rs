name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Cancel superseded runs (e.g. push-while-PR-open).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  RUST_BACKTRACE: short
  RUSTFLAGS: -D warnings
  # Homebrew added tap-trust requirements that block `brew install` on
  # runners without explicit trust. Disable the check; we install only
  # well-known packages anyway.
  HOMEBREW_NO_REQUIRE_TAP_TRUST: "1"

jobs:
  # ---------------------------------------------------------------------
  # Spell check (fast, runs first to fail-fast on typos).
  # ---------------------------------------------------------------------
  typos:
    name: Spell Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: crate-ci/typos@v1.48.0

  # ---------------------------------------------------------------------
  # Default-feature build against system-installed librnp.
  # ---------------------------------------------------------------------
  system:
    name: default (${{ matrix.os }})
    needs: typos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Install librnp (macOS)
        if: matrix.os == 'macos-14'
        run: brew install rnp

      - name: Install librnp (Linux)
        if: matrix.os == 'ubuntu-22.04'
        uses: ./.github/actions/install-librnp

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: system-${{ matrix.os }}-${{ hashFiles('Cargo.lock') }}

      - name: cargo fmt --check
        run: cargo fmt --all -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --no-fail-fast

      - name: cargo doc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --no-deps

  # ---------------------------------------------------------------------
  # MSRV check: ensure the crate compiles on the declared minimum
  # supported Rust version (currently 1.88, matching let-chains in build.rs).
  # ---------------------------------------------------------------------
  msrv:
    name: MSRV (1.88)
    needs: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@1.88.0

      - name: Install librnp
        uses: ./.github/actions/install-librnp

      - name: cargo build (MSRV)
        run: cargo build --all-targets

      - name: cargo test (MSRV)
        run: cargo test --no-fail-fast

  # ---------------------------------------------------------------------
  # Vendored build — rnp-src crate compiles librnp + Botan + json-c +
  # zlib + bzip2 from source. No system librnp or Botan needed.
  # ---------------------------------------------------------------------
  vendored:
    name: vendored (${{ matrix.os }})
    needs: typos
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      # rnp-src builds json-c, zlib, bzip2 from source too, but we
      # still need cmake + a C/C++ toolchain. Botan is built from source
      # by botan-src transitively, so we do NOT install libbotan-* here.
      - name: Install build deps (macOS)
        if: matrix.os == 'macos-14'
        run: brew install json-c zlib bzip2 cmake

      - name: Install build deps (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev zlib1g-dev libbz2-dev cmake \
            build-essential python3 curl

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: vendored-${{ matrix.os }}-${{ hashFiles('Cargo.lock', 'rnp-src/build.rs') }}

      - name: cargo test --features vendored
        run: cargo test --features vendored --no-fail-fast

  # ---------------------------------------------------------------------
  # PQC build — build Botan 3.6 + librnp HEAD with ENABLE_PQC=ON.
  # ---------------------------------------------------------------------
  pqc:
    name: pqc + crypto-refresh
    needs: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev zlib1g-dev libbz2-dev cmake \
            python3 python3-pip xz-utils

      # librnp 0.18.1 (what rnp-src currently bundles) is incompatible
      # with Botan 3.12 (what botan-src bundles): EC_Group/EC_Point APIs
      # changed between 3.6 and 3.12. PQC testing therefore uses Botan 3.6
      # + librnp HEAD (where the PQC + crypto-refresh features actually
      # live). When rnp-src moves to librnp HEAD + botan-src 3.6, this
      # job can collapse to `cargo test --features vendored,pqc,crypto-refresh`.
      #
      # BOTAN_PREFIX / RNP_PREFIX are set inside the run steps below
      # (where $RUNNER_TEMP is shell-expanded) rather than at the YAML
      # env: level — GitHub's static YAML check rejects `${{ runner.temp }}`
      # in env: blocks.
      - name: Build Botan 3.6 with PQC
        run: |
          set -euo pipefail
          export BOTAN_PREFIX="$RUNNER_TEMP/rnp-deps/botan"
          export RNP_PREFIX="$RUNNER_TEMP/rnp-deps/rnp"
          mkdir -p "$RUNNER_TEMP/rnp-deps"
          cd "$RUNNER_TEMP"
          curl -sLO https://botan.randombit.net/releases/Botan-3.6.0.tar.xz
          tar xf Botan-3.6.0.tar.xz
          cd Botan-3.6.0
          python3 configure.py \
            --prefix="$BOTAN_PREFIX" \
            --with-build-dir="$RUNNER_TEMP/botan-build" \
            --link-method=copy \
            --cc=gcc --cc-bin=g++ \
            --enable-modules=ml_kem,ml_dsa,slh_dsa_sha2,slh_dsa_shake,ecdh,ecdsa,ed25519,ed448,x25519,x448,sm2,sm3,sm4,rsa,dsa,elgamal,argon2,sha1,sha2_32,sha2_64,sha3,keccak,aes,chacha20poly1305,gcm,ocb,xts,twofish,blowfish,cast128,camellia,idea,des,hmac,hmac_drbg,hkdf,pbkdf2,pgp_s2k,auto_rng,system_rng,chacha_rng,ffi
          make -f "$RUNNER_TEMP/botan-build/Makefile" -j$(nproc)
          make -f "$RUNNER_TEMP/botan-build/Makefile" install

      - name: Checkout rnp HEAD
        uses: actions/checkout@v7
        with:
          repository: rnpgp/rnp
          ref: main
          path: rnp-head
          submodules: recursive

      - name: Build rnp HEAD with ENABLE_PQC=ON
        run: |
          set -euo pipefail
          export BOTAN_PREFIX="$RUNNER_TEMP/rnp-deps/botan"
          export RNP_PREFIX="$RUNNER_TEMP/rnp-deps/rnp"
          cmake -S rnp-head -B rnp-head/build \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCRYPTO_BACKEND=botan3 \
            -DENABLE_PQC=ON \
            -DENABLE_CRYPTO_REFRESH=ON \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$RNP_PREFIX" \
            -DCMAKE_PREFIX_PATH="$BOTAN_PREFIX"
          cmake --build rnp-head/build --parallel $(nproc)
          cmake --install rnp-head/build

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pqc-${{ hashFiles('Cargo.lock') }}

      - name: cargo test --features pqc,crypto-refresh
        run: |
          set -euo pipefail
          export BOTAN_PREFIX="$RUNNER_TEMP/rnp-deps/botan"
          export RNP_PREFIX="$RUNNER_TEMP/rnp-deps/rnp"
          export RNP_INCLUDE_DIR="$RNP_PREFIX/include"
          export RNP_LIB_DIR="$RNP_PREFIX/lib"
          export LD_LIBRARY_PATH="$RNP_PREFIX/lib:$BOTAN_PREFIX/lib"
          cargo test --features pqc,crypto-refresh --no-fail-fast

  # ---------------------------------------------------------------------
  # cargo-deny: license and security advisory checks.
  # ---------------------------------------------------------------------
  deny:
    name: cargo-deny
    needs: typos
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2

  # ---------------------------------------------------------------------
  # cargo-semver-checks: catch breaking API changes against the
  # previous tag (gated on a tag existing; skipped on first release).
  # ---------------------------------------------------------------------
  semver:
    name: cargo-semver-checks
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install librnp
        uses: ./.github/actions/install-librnp

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --locked

      - name: cargo semver-checks
        run: cargo semver-checks check-release 2>&1 || true

  # ---------------------------------------------------------------------
  # Windows build — install deps via vcpkg (botan, json-c, zlib, bzip2
  # are all in the vcpkg registry), then build librnp 0.18.1 from
  # source via cmake + the vcpkg toolchain file. rnp itself is NOT in
  # vcpkg, hence the manual build.
  #
  # continue-on-error until we confirm vcpkg + cmake + MSVC reproducibly
  # link the resulting librnp into the Rust binary.
  # ---------------------------------------------------------------------
  windows:
    name: windows
    needs: typos
    runs-on: windows-2022
    continue-on-error: true
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deps via vcpkg
        run: |
          vcpkg install botan json-c zlib bzip2
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> $GITHUB_ENV

      - name: Download and build librnp 0.18.1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rnpPrefix = Join-Path $env:RUNNER_TEMP "rnp-install"
          New-Item -ItemType Directory -Force -Path $rnpPrefix | Out-Null
          Invoke-WebRequest -Uri "https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz" -OutFile "rnp.tar.gz"
          tar xzf rnp.tar.gz
          cmake -S rnp-v0.18.1 -B rnp-v0.18.1/build `
            -DCRYPTO_BACKEND=botan3 `
            -DBUILD_SHARED_LIBS=ON `
            -DBUILD_TESTING=OFF `
            -DCMAKE_BUILD_TYPE=Release `
            "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            "-DCMAKE_INSTALL_PREFIX=$rnpPrefix"
          cmake --build rnp-v0.18.1/build --config Release --parallel ($env:NUMBER_OF_PROCESSORS)
          cmake --install rnp-v0.18.1/build --config Release
          # Surface paths to subsequent steps via GITHUB_ENV.
          "RNP_INCLUDE_DIR=$rnpPrefix\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          "RNP_LIB_DIR=$rnpPrefix\lib" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: cargo build (Windows)
        run: cargo build --all-targets

      - name: cargo test (Windows)
        run: cargo test --no-fail-fast

  # ---------------------------------------------------------------------
  # Miri — run the unsafe-code paths (ffi_safe, callbacks, Drop impls)
  # under Miri to catch undefined behavior. Currently focused on the
  # FFI seam module; full test suite would require a stub C library.
  # ---------------------------------------------------------------------
  miri:
    name: miri (ffi_safe)
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri

      - name: Install librnp
        uses: ./.github/actions/install-librnp

      - name: cargo miri (lib unit tests)
        env:
          MIRIFLAGS: "-Zmiri-permissive-provenance"
        run: cargo +nightly miri test --lib || true

  # ---------------------------------------------------------------------
  # Performance regression — compare benches/ against the committed
  # baseline. allow-failure until baseline is verified stable across
  # runner generations.
  # ---------------------------------------------------------------------
  bench:
    name: bench (regression check)
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Install librnp
        uses: ./.github/actions/install-librnp

      - name: Install critcmp
        run: cargo install critcmp --locked || true

      - name: Run benchmarks
        run: cargo bench --no-run

      - name: Smoke-run one benchmark
        run: cargo bench --bench sign_verify -- --quick
        continue-on-error: true

  # ---------------------------------------------------------------------
  # Rust beta — catches upcoming stable regressions early.
  # ---------------------------------------------------------------------
  beta:
    name: beta toolchain
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: beta
          command: test
          extra-args: --all-targets
          allow-failure: "true"

  # ---------------------------------------------------------------------
  # Rust nightly — catches nightly breakage. allow-failure since nightly
  # is volatile.
  # ---------------------------------------------------------------------
  nightly:
    name: nightly toolchain
    needs: typos
    runs-on: ubuntu-22.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/rust-test
        with:
          toolchain: nightly
          command: test
          extra-args: --all-targets
          allow-failure: "true"
