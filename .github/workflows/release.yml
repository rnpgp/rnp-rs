name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------
  # release-plz: opens a "release PR" that bumps version + regenerates
  # CHANGELOG when conventional commits land on main. Merging the PR
  # publishes to crates.io.
  # ---------------------------------------------------------------------
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install librnp
        run: |
          sudo apt-get update
          sudo apt-get install -y librnp-dev

      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------
  # Manual fallback: tag-driven release. Disabled by default; trigger
  # from the Actions UI for emergency releases outside release-plz.
  # ---------------------------------------------------------------------
  publish-manual:
    name: Manual publish (tag-driven)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install librnp
        run: |
          sudo apt-get update
          sudo apt-get install -y librnp-dev libbotan-2-dev libjson-c-dev \
            zlib1g-dev libbz2-dev cmake

      - name: cargo test
        run: cargo test --no-fail-fast

      - name: cargo test --features vendored
        run: cargo test --features vendored --no-fail-fast

      - name: cargo publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
