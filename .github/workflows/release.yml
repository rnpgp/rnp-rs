name: Release

permissions:
  pull-requests: write
  contents: write

on:
  push:
    branches:
      - main

jobs:
  # ---------------------------------------------------------------------
  # release-plz: opens a "release PR" that bumps version + regenerates
  # CHANGELOG when conventional commits land on main. Merging the PR
  # publishes to crates.io.
  #
  # We build librnp 0.18.1 from source because Ubuntu's librnp-dev is
  # significantly older and missing many symbols the crate uses (notably
  # the rnp_op_verify_get_* family added in 0.17+).
  # ---------------------------------------------------------------------
  release-plz:
    name: release-plz
    runs-on: ubuntu-latest
    env:
      # Build prefixes live OUTSIDE the repo working directory so
      # release-plz doesn't see them as uncommitted changes.
      BUILD_PREFIX: ${{ runner.temp }}/rnp-deps
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libbotan-2-dev libjson-c-dev \
            zlib1g-dev libbz2-dev cmake build-essential python3

      - name: Build Botan 3.x
        env:
          BOTAN_PREFIX: ${{ env.BUILD_PREFIX }}/botan
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://botan.randombit.net/releases/Botan-3.6.0.tar.xz
          tar xf Botan-3.6.0.tar.xz
          cd Botan-3.6.0
          python3 configure.py \
            --prefix=$BOTAN_PREFIX \
            --with-build-dir=$RUNNER_TEMP/botan-build \
            --link-method=copy \
            --cc=gcc --cc-bin=g++ \
            --disable-modules=unsupported
          make -f $RUNNER_TEMP/botan-build/Makefile -j$(nproc)
          make -f $RUNNER_TEMP/botan-build/Makefile install

      - name: Build librnp 0.18.1
        env:
          BOTAN_PREFIX: ${{ env.BUILD_PREFIX }}/botan
          RNP_PREFIX: ${{ env.BUILD_PREFIX }}/rnp
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz
          tar xf rnp-v0.18.1.tar.gz
          cmake -S rnp-v0.18.1 -B rnp-v0.18.1/build \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCRYPTO_BACKEND=botan3 \
            -DBUILD_SHARED_LIBS=ON \
            -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$RNP_PREFIX \
            -DCMAKE_PREFIX_PATH=$BOTAN_PREFIX
          cmake --build rnp-v0.18.1/build --parallel $(nproc)
          cmake --install rnp-v0.18.1/build

      - name: Point rnp-rs at the locally-built librnp
        env:
          BOTAN_PREFIX: ${{ env.BUILD_PREFIX }}/botan
          RNP_PREFIX: ${{ env.BUILD_PREFIX }}/rnp
        run: |
          echo "RNP_INCLUDE_DIR=$RNP_PREFIX/include" >> $GITHUB_ENV
          echo "RNP_LIB_DIR=$RNP_PREFIX/lib" >> $GITHUB_ENV
          echo "LD_LIBRARY_PATH=$RNP_PREFIX/lib:$BOTAN_PREFIX/lib" >> $GITHUB_ENV

      - name: Smoke-build the crate against the new librnp
        run: cargo build --all-targets

      - uses: MarcoIeni/release-plz-action@v0.5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  # ---------------------------------------------------------------------
  # Manual fallback: tag-driven release. Disabled by default; trigger
  # from the Actions UI for emergency releases outside release-plz.
  # ---------------------------------------------------------------------
  publish-manual:
    name: Manual publish (tag-driven)
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      BUILD_PREFIX: ${{ runner.temp }}/rnp-deps
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libbotan-2-dev libjson-c-dev \
            zlib1g-dev libbz2-dev cmake build-essential python3

      - name: Build Botan 3.x + librnp 0.18.1
        env:
          BOTAN_PREFIX: ${{ env.BUILD_PREFIX }}/botan
          RNP_PREFIX: ${{ env.BUILD_PREFIX }}/rnp
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://botan.randombit.net/releases/Botan-3.6.0.tar.xz
          tar xf Botan-3.6.0.tar.xz
          cd Botan-3.6.0
          python3 configure.py --prefix=$BOTAN_PREFIX --cc=gcc --cc-bin=g++ \
            --with-build-dir=$RUNNER_TEMP/botan-build --link-method=copy
          make -f $RUNNER_TEMP/botan-build/Makefile -j$(nproc)
          make -f $RUNNER_TEMP/botan-build/Makefile install
          cd ..
          curl -sLO https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz
          tar xf rnp-v0.18.1.tar.gz
          cmake -S rnp-v0.18.1 -B rnp-v0.18.1/build \
            -DCMAKE_C_COMPILER=gcc -DCMAKE_CXX_COMPILER=g++ \
            -DCRYPTO_BACKEND=botan3 \
            -DBUILD_SHARED_LIBS=ON -DBUILD_TESTING=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$RNP_PREFIX \
            -DCMAKE_PREFIX_PATH=$BOTAN_PREFIX
          cmake --build rnp-v0.18.1/build --parallel $(nproc)
          cmake --install rnp-v0.18.1/build

      - name: cargo test (system)
        env:
          RNP_INCLUDE_DIR: ${{ env.RNP_PREFIX }}/include
          RNP_LIB_DIR: ${{ env.RNP_PREFIX }}/lib
          LD_LIBRARY_PATH: ${{ env.RNP_PREFIX }}/lib:${{ env.BOTAN_PREFIX }}/lib
        run: cargo test --no-fail-fast

      - name: cargo test --features vendored
        run: cargo test --features vendored --no-fail-fast

      - name: cargo publish
        run: cargo publish --token ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
