name: Prebuild Static Libraries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev zlib1g-dev libbz2-dev \
            cmake build-essential python3 curl xz-utils

      - name: Install build deps (macOS)
        if: matrix.os == 'macos'
        run: brew install json-c zlib bzip2 cmake

      - name: Build Botan 3.6
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://botan.randombit.net/releases/Botan-3.12.0.tar.xz
          tar xf Botan-3.12.0.tar.xz
          cd Botan-3.12.0
          if [ "${{ matrix.os }}" = "macos" ]; then
            python3 configure.py \
              --prefix=$RUNNER_TEMP/botan-install \
              --with-build-dir=$RUNNER_TEMP/botan-build \
              --link-method=copy \
              --cc=clang --cc-bin=/usr/bin/clang++ \
              --disable-modules=unsupported
          else
            python3 configure.py \
              --prefix=$RUNNER_TEMP/botan-install \
              --with-build-dir=$RUNNER_TEMP/botan-build \
              --link-method=copy \
              --cc=gcc --cc-bin=g++ \
              --disable-modules=unsupported
          fi
          make -f $RUNNER_TEMP/botan-build/Makefile -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make -f $RUNNER_TEMP/botan-build/Makefile install

      - name: Build json-c (Linux only — macOS uses Homebrew)
        if: matrix.os == 'linux'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://s3.amazonaws.com/json-c_releases/releases/json-c-0.17.tar.gz
          tar xf json-c-0.17.tar.gz
          cmake -S json-c-0.17 -B json-c-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstring" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/json-c-install
          cmake --build json-c-build --parallel $(nproc)
          cmake --install json-c-build

      - name: Build librnp statically
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz
          tar xf rnp-v0.18.1.tar.gz

          BOTAN_PREFIX="$RUNNER_TEMP/botan-install"

          if [ "${{ matrix.os }}" = "macos" ]; then
            JSONC_PREFIX="$(brew --prefix json-c)"
            ZLIB_PREFIX="$(brew --prefix zlib)"
            BZIP2_PREFIX="$(brew --prefix bzip2)"
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
          else
            JSONC_PREFIX="$RUNNER_TEMP/json-c-install"
            ZLIB_PREFIX="/usr"
            BZIP2_PREFIX="/usr"
            CC=gcc
            CXX=g++
          fi

          PREFIX_PATH="$BOTAN_PREFIX;$JSONC_PREFIX;$ZLIB_PREFIX;$BZIP2_PREFIX"

          cmake -S rnp-v0.18.1 -B rnp-build \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCRYPTO_BACKEND=botan3 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_DOC=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstring" \
            -DCMAKE_PREFIX_PATH="$PREFIX_PATH" \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/rnp-install
          cmake --build rnp-build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install rnp-build

      - name: Collect artifacts
        run: |
          TARGET=${{ matrix.target }}
          mkdir -p prebuilt/$TARGET/lib prebuilt/$TARGET/include/rnp

          cp $RUNNER_TEMP/rnp-install/lib/librnp.a prebuilt/$TARGET/lib/
          cp $RUNNER_TEMP/rnp-install/lib/libsexpp.a prebuilt/$TARGET/lib/

          if [ "${{ matrix.os }}" = "macos" ]; then
            cp $(brew --prefix json-c)/lib/libjson-c.a prebuilt/$TARGET/lib/
          else
            cp $RUNNER_TEMP/json-c-install/lib/libjson-c.a prebuilt/$TARGET/lib/
          fi

          cp $RUNNER_TEMP/rnp-install/include/rnp/*.h prebuilt/$TARGET/include/rnp/

          echo "=== prebuilt/$TARGET ==="
          find prebuilt/$TARGET -type f
          du -sh prebuilt/$TARGET/lib/*.a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}
          path: prebuilt/${{ matrix.target }}/

  commit:
    name: Commit prebuilt libs
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilt-downloads
          pattern: prebuilt-*
          merge-multiple: false

      - name: Assemble prebuilt directory
        run: |
          for dir in prebuilt-downloads/prebuilt-*; do
            target=$(basename "$dir" | sed 's/prebuilt-//')
            rm -rf "prebuilt/$target"
            mkdir -p "prebuilt/$target"
            cp -r "$dir"/* "prebuilt/$target/"
          done
          echo "=== All prebuilt targets ==="
          find prebuilt -type f | sort

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/prebuilt-update
          git add prebuilt/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update prebuilt static libraries for all platforms

          Targets: $(ls prebuilt/ | tr '\n' ' ')"
          git push --force-with-lease origin chore/prebuilt-update

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head chore/prebuilt-update --state open --json number --jq 'length')
          if [ "$PR_EXISTS" = "0" ]; then
            gh pr create \
              --title "chore: update prebuilt static libraries for all platforms" \
              --body "Pre-built static librnp + json-c for all supported targets. Built via the prebuild-static-libs workflow." \
              --base main \
              --head chore/prebuilt-update
          else
            echo "PR already exists"
          fi
