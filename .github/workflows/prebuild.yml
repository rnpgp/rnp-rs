name: Prebuild Static Libraries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    name: Build (${{ matrix.target }} / ${{ matrix.backend }} / ${{ matrix.libc }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---------- macOS (no libc dimension; system libc only) ----------
          - { target: x86_64-apple-darwin,  runner: macos-15-intel, os: macos, backend: botan-full,    libc: default }
          - { target: x86_64-apple-darwin,  runner: macos-15-intel, os: macos, backend: botan-minimal, libc: default }
          - { target: x86_64-apple-darwin,  runner: macos-15-intel, os: macos, backend: botan-pqc,     libc: default }
          - { target: x86_64-apple-darwin,  runner: macos-15-intel, os: macos, backend: openssl3,     libc: default }
          - { target: aarch64-apple-darwin, runner: macos-latest,   os: macos, backend: botan-full,    libc: default }
          - { target: aarch64-apple-darwin, runner: macos-latest,   os: macos, backend: botan-minimal, libc: default }
          - { target: aarch64-apple-darwin, runner: macos-latest,   os: macos, backend: botan-pqc,     libc: default }
          - { target: aarch64-apple-darwin, runner: macos-latest,   os: macos, backend: openssl3,     libc: default }
          # ---------- Linux glibc (native runners) ----------
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     os: linux, backend: botan-full,    libc: gnu }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     os: linux, backend: botan-minimal, libc: gnu }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     os: linux, backend: botan-pqc,     libc: gnu }
          - { target: x86_64-unknown-linux-gnu,  runner: ubuntu-24.04,     os: linux, backend: openssl3,     libc: gnu }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, os: linux, backend: botan-full,    libc: gnu }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, os: linux, backend: botan-minimal, libc: gnu }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, os: linux, backend: botan-pqc,     libc: gnu }
          - { target: aarch64-unknown-linux-gnu, runner: ubuntu-24.04-arm, os: linux, backend: openssl3,     libc: gnu }
          # ---------- Linux musl (Alpine container on x86_64 runner only) ----------
          # GitHub Actions limitation: JavaScript actions (checkout, upload-
          # artifact) can't run inside Alpine containers on ARM64 runners.
          # aarch64-musl consumers must cross-compile from x86_64-musl or
          # use the glibc aarch64 variant.
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, os: linux, backend: botan-full,    libc: musl, container: alpine:latest }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, os: linux, backend: botan-minimal, libc: musl, container: alpine:latest }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, os: linux, backend: botan-pqc,     libc: musl, container: alpine:latest }
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04, os: linux, backend: openssl3,     libc: musl, container: alpine:latest }
          # ---------- Windows (MSVC, x86_64 only for now) ----------
          # Static libs produced as *.lib (not *.a). aarch64-pc-windows-msvc
          # runner exists (windows-11-arm) but the MSVC ARM64 toolchain is
          # still maturing — add in a follow-up.
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, os: windows, backend: botan-full,    libc: msvc }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, os: windows, backend: botan-minimal, libc: msvc }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, os: windows, backend: botan-pqc,     libc: msvc }
          - { target: x86_64-pc-windows-msvc, runner: windows-2022, os: windows, backend: openssl3,     libc: msvc }
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps (Linux, gnu)
        if: matrix.os == 'linux' && matrix.libc == 'gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev zlib1g-dev libbz2-dev \
            cmake build-essential python3 curl xz-utils perl

      - name: Install build deps (Linux, musl — Alpine container)
        if: matrix.os == 'linux' && matrix.libc == 'musl'
        run: |
          apk add --no-cache \
            build-base cmake python3 curl xz perl \
            json-c-dev zlib-dev bzip2-dev \
            linux-headers \
            git

      - name: Install build deps (macOS)
        if: matrix.os == 'macos'
        run: brew install json-c zlib bzip2 cmake

      - name: Install build deps (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          # Visual Studio + CMake + Python + Git + Ninja are pre-installed
          # on windows-2022. We need: Perl (for OpenSSL Configure), NASM
          # (for OpenSSL ASM).
          # NOTE: choco "perl" package was removed; use strawberryperl.
          choco install -y --no-progress strawberryperl nasm
          echo "C:\Program Files\NASM" >> $env:GITHUB_PATH
          echo "C:\Strawberry\perl\bin" >> $env:GITHUB_PATH

      # ---------------------------------------------------------------------
      # Backend: Botan (full or minimal module set)
      # ---------------------------------------------------------------------
      - name: Build Botan 3.12 (static, Unix)
        if: startsWith(matrix.backend, 'botan') && matrix.os != 'windows'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://botan.randombit.net/releases/Botan-3.12.0.tar.xz
          tar xf Botan-3.12.0.tar.xz
          cd Botan-3.12.0

          # - botan-full:    everything except `unsupported`.
          # - botan-minimal: drops PQC, SM2/3/4, Twofish/Blowfish/CAST5/IDEA,
          #                  Ed448/X448, Brainpool, RIPEMD-160, TLS, I/O/DB
          #                  glue. Use --disable-modules for resilience
          #                  across Botan versions.
          # - botan-pqc:     same as botan-full, plus explicitly enables the
          #                  PQC modules (ml_kem, ml_dsa, slh_dsa_sha2,
          #                  slh_dsa_shake) so librnp's ENABLE_PQC=ON has
          #                  symbols to link against.
          if [ "${{ matrix.backend }}" = "botan-minimal" ]; then
            MODULES_FLAG="--disable-modules=unsupported,tls,tls_10,tls_12,tls_13,dtls,http_client,sockets,sqlite3,boost,pkcs11,tpm2,ml_kem,ml_dsa,slh_dsa_sha2,slh_dsa_shake,sm2,sm3,sm4,twofish,blowfish,cast_128,idea,ed448,x448,ripemd_160,brainpool256r1,brainpool384r1,brainpool512r1"
          elif [ "${{ matrix.backend }}" = "botan-pqc" ]; then
            MODULES_FLAG="--disable-modules=unsupported"
          else
            MODULES_FLAG="--disable-modules=unsupported"
          fi

          if [ "${{ matrix.os }}" = "macos" ]; then
            CC_FLAG="--cc=clang --cc-bin=/usr/bin/clang++"
          else
            CC_FLAG="--cc=gcc --cc-bin=g++"
          fi

          python3 configure.py \
            --prefix=$RUNNER_TEMP/botan-install \
            --with-build-dir=$RUNNER_TEMP/botan-build \
            --link-method=copy \
            $CC_FLAG \
            --disable-shared-library \
            $MODULES_FLAG
          make -f $RUNNER_TEMP/botan-build/Makefile -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make -f $RUNNER_TEMP/botan-build/Makefile install
          du -sh $RUNNER_TEMP/botan-install/lib/libbotan-3.a

      - name: Build Botan 3.12 (static, Windows)
        if: startsWith(matrix.backend, 'botan') && matrix.os == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd "%RUNNER_TEMP%"
          curl -sLO https://botan.randombit.net/releases/Botan-3.12.0.tar.xz
          tar xf Botan-3.12.0.tar.xz
          cd Botan-3.12.0
          if "${{ matrix.backend }}" == "botan-minimal" (
            set MODULES_FLAG=--disable-modules=unsupported,tls,tls_10,tls_12,tls_13,dtls,http_client,sockets,sqlite3,boost,pkcs11,tpm2,ml_kem,ml_dsa,slh_dsa_sha2,slh_dsa_shake,sm2,sm3,sm4,twofish,blowfish,cast_128,idea,ed448,x448,ripemd_160,brainpool256r1,brainpool384r1,brainpool512r1
          ) else (
            set MODULES_FLAG=--disable-modules=unsupported
          )
          python configure.py ^
            --prefix=%RUNNER_TEMP%\botan-install ^
            --with-build-dir=%RUNNER_TEMP%\botan-build ^
            --link-method=copy ^
            --cc=msvc ^
            --os=windows ^
            --cpu=x86_64 ^
            --disable-shared-library ^
            %MODULES_FLAG%
          nmake -f %RUNNER_TEMP%\botan-build\Makefile /NOCOLOR
          nmake -f %RUNNER_TEMP%\botan-build\Makefile install
          dir "%RUNNER_TEMP%\botan-install\lib"

      # ---------------------------------------------------------------------
      # Backend: OpenSSL 3.x
      # ---------------------------------------------------------------------
      - name: Build OpenSSL 3.x (static, Unix)
        if: matrix.backend == 'openssl3' && matrix.os != 'windows'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz
          tar xf openssl-3.5.0.tar.gz
          cd openssl-3.5.0

          case "${{ matrix.target }}" in
            x86_64-apple-darwin)         OS_TARGET="darwin64-x86_64-cc" ;;
            aarch64-apple-darwin)        OS_TARGET="darwin64-arm64-cc" ;;
            x86_64-unknown-linux-*)      OS_TARGET="linux-x86_64" ;;
            aarch64-unknown-linux-*)     OS_TARGET="linux-aarch64" ;;
          esac

          EXTRA_FLAGS=""
          if [ "${{ matrix.libc }}" = "musl" ]; then
            EXTRA_FLAGS="no-asm"
          fi

          ./Configure $OS_TARGET no-shared no-tests no-apps $EXTRA_FLAGS \
            --prefix=$RUNNER_TEMP/openssl-install \
            --libdir=lib
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make install_sw
          du -sh $RUNNER_TEMP/openssl-install/lib/libcrypto.a

      - name: Build OpenSSL 3.x (static, Windows)
        if: matrix.backend == 'openssl3' && matrix.os == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd "%RUNNER_TEMP%"
          curl -sLO https://github.com/openssl/openssl/releases/download/openssl-3.5.0/openssl-3.5.0.tar.gz
          tar xf openssl-3.5.0.tar.gz
          cd openssl-3.5.0
          perl Configure VC-WIN64A no-shared no-tests no-apps no-asm ^
            --prefix="%RUNNER_TEMP%\openssl-install" ^
            --libdir=lib
          nmake
          nmake install_sw
          dir "%RUNNER_TEMP%\openssl-install\lib"

      # ---------------------------------------------------------------------
      # Common deps: json-c, zlib, bzip2 (Linux only — macOS uses Homebrew)
      # ---------------------------------------------------------------------
      - name: Build json-c (Linux/macOS)
        if: matrix.os != 'windows'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://s3.amazonaws.com/json-c_releases/releases/json-c-0.17.tar.gz
          tar xf json-c-0.17.tar.gz

          POLICY_FLAG=""
          # CMake 4.x (shipped on Alpine and now macOS Homebrew) dropped
          # support for cmake_minimum_required < 3.5. json-c 0.17 declares
          # 3.0. Apply the policy flag on all non-Linux-glibc runners.
          if [ "${{ matrix.libc }}" = "musl" ] || [ "${{ matrix.os }}" = "macos" ]; then
            POLICY_FLAG="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          fi

          cmake -S json-c-0.17 -B json-c-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstring" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            $POLICY_FLAG \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/json-c-install
          cmake --build json-c-build --parallel $(nproc)
          cmake --install json-c-build

      - name: Build json-c (Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd "%RUNNER_TEMP%"
          curl -sLO https://s3.amazonaws.com/json-c_releases/releases/json-c-0.17.tar.gz
          tar xf json-c-0.17.tar.gz
          cmake -S json-c-0.17 -B json-c-build ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_TESTING=OFF ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\json-c-install"
          cmake --build json-c-build --parallel %NUMBER_OF_PROCESSORS%
          cmake --install json-c-build

      - name: Build zlib (static, Unix)
        if: matrix.os != 'windows'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz

          POLICY_FLAG=""
          if [ "${{ matrix.libc }}" = "musl" ] || [ "${{ matrix.os }}" = "macos" ]; then
            POLICY_FLAG="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          fi

          cmake -S zlib-1.3.1 -B zlib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            $POLICY_FLAG \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/zlib-install
          cmake --build zlib-build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install zlib-build

      - name: Build zlib (static, Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd "%RUNNER_TEMP%"
          curl -sLO https://github.com/madler/zlib/releases/download/v1.3.1/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cmake -S zlib-1.3.1 -B zlib-build ^
            -G "Ninja" ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DCMAKE_INSTALL_PREFIX="%RUNNER_TEMP%\zlib-install"
          cmake --build zlib-build --parallel %NUMBER_OF_PROCESSORS%
          cmake --install zlib-build

      - name: Build bzip2 (static, Unix)
        if: matrix.os != 'windows'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          tar xf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          if [ "${{ matrix.os }}" = "macos" ]; then
            CC=/usr/bin/clang
          else
            CC=gcc
          fi
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) CC="$CC" CFLAGS="-O3 -fPIC" libbz2.a bzip2 bzip2recover
          mkdir -p $RUNNER_TEMP/bzip2-install/lib $RUNNER_TEMP/bzip2-install/include
          cp libbz2.a $RUNNER_TEMP/bzip2-install/lib/
          cp bzlib.h $RUNNER_TEMP/bzip2-install/include/

      - name: Build bzip2 (static, Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd "%RUNNER_TEMP%"
          curl -sLO https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          tar xf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          # Build libbz2.lib using the provided makefile.msc
          nmake -f makefile.msc libbz2.lib
          mkdir "%RUNNER_TEMP%\bzip2-install\lib" "%RUNNER_TEMP%\bzip2-install\include"
          copy libbz2.lib "%RUNNER_TEMP%\bzip2-install\lib\"
          copy bzlib.h "%RUNNER_TEMP%\bzip2-install\include\"

      # ---------------------------------------------------------------------
      # librnp — built against the selected backend.
      # ---------------------------------------------------------------------
      - name: Build librnp statically (Unix)
        if: matrix.os != 'windows'
        run: |
          cd $RUNNER_TEMP
          if [ "${{ matrix.backend }}" = "botan-pqc" ]; then
            git clone --depth 1 --recurse-submodules --shallow-submodules \
              https://github.com/rnpgp/rnp.git rnp-src
            RNP_SRCDIR="$RUNNER_TEMP/rnp-src"
          else
            curl -sLO https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz
            tar xf rnp-v0.18.1.tar.gz
            RNP_SRCDIR="$RUNNER_TEMP/rnp-v0.18.1"
          fi

          if [ "${{ matrix.backend }}" = "botan-pqc" ]; then
            perl -i -pe 's/#include <botan\/ffi\.h>/#include <botan\/ffi.h>\n#include <botan\/ec_group.h>/' \
              "$RNP_SRCDIR/src/lib/crypto/ec.cpp"
            printf '%s\n' \
              '#include <botan/ec_group.h>' \
              '#include <botan/bigint.h>' \
              '#include <botan/ec_apoint.h>' \
              > /tmp/botan-includes.h
            cat /tmp/botan-includes.h "$RNP_SRCDIR/src/lib/crypto/exdsa_ecdhkem.cpp" \
              > /tmp/exdsa-new.cpp
            mv /tmp/exdsa-new.cpp "$RNP_SRCDIR/src/lib/crypto/exdsa_ecdhkem.cpp"
          fi

          ZLIB_PREFIX="$RUNNER_TEMP/zlib-install"
          BZIP2_PREFIX="$RUNNER_TEMP/bzip2-install"

          case "${{ matrix.backend }}" in
            botan-full|botan-minimal|botan-pqc)
              CRYPTO_BACKEND=botan3
              CRYPTO_PREFIX="$RUNNER_TEMP/botan-install"
              ;;
            openssl3)
              CRYPTO_BACKEND=openssl
              CRYPTO_PREFIX="$RUNNER_TEMP/openssl-install"
              ;;
          esac

          EXTRA_RNP_FLAGS=""
          if [ "${{ matrix.backend }}" = "botan-pqc" ]; then
            EXTRA_RNP_FLAGS="-DENABLE_PQC=ON -DENABLE_CRYPTO_REFRESH=ON"
          fi

          if [ "${{ matrix.os }}" = "macos" ]; then
            JSONC_PREFIX="$(brew --prefix json-c)"
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
          else
            JSONC_PREFIX="$RUNNER_TEMP/json-c-install"
            CC=gcc
            CXX=g++
          fi

          PREFIX_PATH="$CRYPTO_PREFIX;$JSONC_PREFIX;$ZLIB_PREFIX;$BZIP2_PREFIX"

          POLICY_FLAG=""
          if [ "${{ matrix.libc }}" = "musl" ] || [ "${{ matrix.os }}" = "macos" ]; then
            POLICY_FLAG="-DCMAKE_POLICY_VERSION_MINIMUM=3.5"
          fi

          cmake -S "$RNP_SRCDIR" -B rnp-build \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCRYPTO_BACKEND=$CRYPTO_BACKEND \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_DOC=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstring" \
            -DCMAKE_PREFIX_PATH="$PREFIX_PATH" \
            $POLICY_FLAG \
            $EXTRA_RNP_FLAGS \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/rnp-install
          cmake --build rnp-build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install rnp-build

      - name: Build librnp statically (Windows)
        if: matrix.os == 'windows'
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cd "%RUNNER_TEMP%"
          if "${{ matrix.backend }}" == "botan-pqc" (
            git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/rnpgp/rnp.git rnp-src
            set RNP_SRCDIR=%RUNNER_TEMP%\rnp-src
          ) else (
            curl -sLO https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz
            tar xf rnp-v0.18.1.tar.gz
            set RNP_SRCDIR=%RUNNER_TEMP%\rnp-v0.18.1
          )

          set ZLIB_PREFIX=%RUNNER_TEMP%\zlib-install
          set BZIP2_PREFIX=%RUNNER_TEMP%\bzip2-install

          if "${{ matrix.backend }}" == "botan-full" (
            set CRYPTO_BACKEND=botan3
            set CRYPTO_PREFIX=%RUNNER_TEMP%\botan-install
          ) else if "${{ matrix.backend }}" == "botan-minimal" (
            set CRYPTO_BACKEND=botan3
            set CRYPTO_PREFIX=%RUNNER_TEMP%\botan-install
          ) else if "${{ matrix.backend }}" == "botan-pqc" (
            set CRYPTO_BACKEND=botan3
            set CRYPTO_PREFIX=%RUNNER_TEMP%\botan-install
          ) else if "${{ matrix.backend }}" == "openssl3" (
            set CRYPTO_BACKEND=openssl
            set CRYPTO_PREFIX=%RUNNER_TEMP%\openssl-install
          )

          set EXTRA_RNP_FLAGS=
          if "${{ matrix.backend }}" == "botan-pqc" (
            set EXTRA_RNP_FLAGS=-DENABLE_PQC=ON -DENABLE_CRYPTO_REFRESH=ON
          )

          set JSONC_PREFIX=%RUNNER_TEMP%\json-c-install
          set PREFIX_PATH=%CRYPTO_PREFIX%;%JSONC_PREFIX%;%ZLIB_PREFIX%;%BZIP2_PREFIX%

          cmake -S "%RNP_SRCDIR%" -B rnp-build ^
            -G "Ninja" ^
            -DCRYPTO_BACKEND=%CRYPTO_BACKEND% ^
            -DBUILD_SHARED_LIBS=OFF ^
            -DBUILD_TESTING=OFF ^
            -DENABLE_DOC=OFF ^
            -DCMAKE_BUILD_TYPE=Release ^
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 ^
            -DCMAKE_PREFIX_PATH="%PREFIX_PATH%" ^
            %EXTRA_RNP_FLAGS% ^
            -DCMAKE_INSTALL_PREFIX=%RUNNER_TEMP%\rnp-install
          cmake --build rnp-build --parallel %NUMBER_OF_PROCESSORS%
          cmake --install rnp-build
          dir "%RUNNER_TEMP%\rnp-install\lib"

      # ---------------------------------------------------------------------
      # Collect artifacts. Destination layout:
      #   prebuilt/<target>[-<backend-suffix>]/
      # where the suffix is empty for botan-full, otherwise -minimal /
      # -openssl3.
      # ---------------------------------------------------------------------
      - name: Collect artifacts (Unix)
        if: matrix.os != 'windows'
        run: |
          TARGET=${{ matrix.target }}
          BACKEND=${{ matrix.backend }}
          case "$BACKEND" in
            botan-full)    SUFFIX="" ;;
            botan-minimal) SUFFIX="-minimal" ;;
            botan-pqc)     SUFFIX="-pqc" ;;
            openssl3)      SUFFIX="-openssl3" ;;
          esac
          DEST="prebuilt/$TARGET$SUFFIX"
          mkdir -p $DEST/lib $DEST/include/rnp

          cp $RUNNER_TEMP/rnp-install/lib/librnp.a $DEST/lib/
          cp $RUNNER_TEMP/rnp-install/lib/libsexpp.a $DEST/lib/

          if [ "${{ matrix.os }}" = "macos" ]; then
            cp $(brew --prefix json-c)/lib/libjson-c.a $DEST/lib/
          else
            cp $RUNNER_TEMP/json-c-install/lib/libjson-c.a $DEST/lib/
          fi

          cp $RUNNER_TEMP/zlib-install/lib/libz.a $DEST/lib/
          cp $RUNNER_TEMP/bzip2-install/lib/libbz2.a $DEST/lib/

          case "$BACKEND" in
            botan-full|botan-minimal|botan-pqc)
              cp $RUNNER_TEMP/botan-install/lib/libbotan-3.a $DEST/lib/
              ;;
            openssl3)
              cp $RUNNER_TEMP/openssl-install/lib/libcrypto.a $DEST/lib/
              cp $RUNNER_TEMP/openssl-install/lib/libssl.a $DEST/lib/
              ;;
          esac

          cp $RUNNER_TEMP/rnp-install/include/rnp/*.h $DEST/include/rnp/

          echo "=== $DEST ==="
          find $DEST -type f
          du -sh $DEST/lib/*.a

      - name: Collect artifacts (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $target = "${{ matrix.target }}"
          $backend = "${{ matrix.backend }}"
          $suffix = switch ($backend) {
            "botan-full"    { "" }
            "botan-minimal" { "-minimal" }
            "botan-pqc"     { "-pqc" }
            "openssl3"      { "-openssl3" }
          }
          $dest = "prebuilt/$target$suffix"
          New-Item -ItemType Directory -Force -Path "$dest/lib", "$dest/include/rnp" | Out-Null

          # On Windows static libs are *.lib (no leading "lib" prefix).
          Copy-Item "$env:RUNNER_TEMP/rnp-install/lib/rnp.lib"   "$dest/lib/"
          Copy-Item "$env:RUNNER_TEMP/rnp-install/lib/sexpp.lib" "$dest/lib/"
          Copy-Item "$env:RUNNER_TEMP/json-c-install/lib/json-c.lib" "$dest/lib/"
          Copy-Item "$env:RUNNER_TEMP/zlib-install/lib/zlibstatic.lib" "$dest/lib/z.lib"
          Copy-Item "$env:RUNNER_TEMP/bzip2-install/lib/libbz2.lib" "$dest/lib/bz2.lib"

          switch ($backend) {
            { $_ -in "botan-full", "botan-minimal", "botan-pqc" } {
              Copy-Item "$env:RUNNER_TEMP/botan-install/lib/botan-3.lib" "$dest/lib/"
            }
            "openssl3" {
              Copy-Item "$env:RUNNER_TEMP/openssl-install/lib/libcrypto.lib" "$dest/lib/crypto.lib"
              Copy-Item "$env:RUNNER_TEMP/openssl-install/lib/libssl.lib" "$dest/lib/ssl.lib"
            }
          }

          Copy-Item "$env:RUNNER_TEMP/rnp-install/include/rnp/*.h" "$dest/include/rnp/"
          Write-Host "=== $dest ==="
          Get-ChildItem -Recurse $dest | Select-Object FullName

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}-${{ matrix.backend }}-${{ matrix.libc }}
          path: prebuilt/

  commit:
    name: Commit prebuilt libs
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Always branch off main, NOT the dispatching branch. Otherwise the
      # `chore/prebuilt-update` push carries workflow-file edits from the
      # feature branch, which the default GITHUB_TOKEN can't push without
      # `workflows` permission.
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilt-downloads
          pattern: prebuilt-*
          merge-multiple: false

      - name: Assemble prebuilt directory
        run: |
          # Each artifact contains the entire prebuilt/ tree as the build
          # job saw it. Merge by copying non-empty files; later artifacts
          # extend the tree rather than overwriting it.
          for dir in prebuilt-downloads/prebuilt-*; do
            if [ -d "$dir/prebuilt" ]; then
              cp -rn "$dir/prebuilt/"* prebuilt/ 2>/dev/null || \
                cp -r "$dir/prebuilt/"* prebuilt/
            fi
          done
          echo "=== All prebuilt targets ==="
          find prebuilt -type f | sort

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/prebuilt-update
          git add prebuilt/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update prebuilt static libraries for all platforms

          Targets: $(ls prebuilt/ | tr '\n' ' ')"
          # If origin/chore/prebuilt-update exists, force-with-lease against
          # it (handles the case where a prior run already pushed). If not
          # (first run after a merge deleted the branch), plain --force.
          if git rev-parse --verify origin/chore/prebuilt-update >/dev/null 2>&1; then
            git push --force-with-lease=chore/prebuilt-update:origin/chore/prebuilt-update origin chore/prebuilt-update
          else
            git push --force origin chore/prebuilt-update
          fi

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head chore/prebuilt-update --state open --json number --jq 'length')
          if [ "$PR_EXISTS" = "0" ]; then
            gh pr create \
              --title "chore: update prebuilt static libraries for all platforms" \
              --body "Pre-built static librnp + crypto backend + json-c + zlib + bzip2 for all supported targets, backends, and libcs. Built via the prebuild workflow." \
              --base main \
              --head chore/prebuilt-update
          else
            echo "PR already exists"
          fi
