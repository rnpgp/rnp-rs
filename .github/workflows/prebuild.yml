name: Prebuild Static Libraries

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0'

jobs:
  build:
    name: Build (${{ matrix.target }} / ${{ matrix.variant }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full Botan variant — every module a modern OpenPGP stack might need.
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            variant: full
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            variant: full
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
            variant: full
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            variant: full
          # Minimal Botan variant — RFC 9580 essentials only (no PQC, no
          # Chinese crypto, no legacy symmetric ciphers).
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            variant: minimal
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            variant: minimal
          - target: x86_64-apple-darwin
            runner: macos-15-intel
            os: macos
            variant: minimal
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            variant: minimal
    steps:
      - uses: actions/checkout@v7

      - name: Install build deps (Linux)
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libjson-c-dev zlib1g-dev libbz2-dev \
            cmake build-essential python3 curl xz-utils

      - name: Install build deps (macOS)
        if: matrix.os == 'macos'
        run: brew install json-c zlib bzip2 cmake

      - name: Build Botan 3.12 (static, ${{ matrix.variant }})
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://botan.randombit.net/releases/Botan-3.12.0.tar.xz
          tar xf Botan-3.12.0.tar.xz
          cd Botan-3.12.0

          # Module sets:
          # - full:    everything Botan ships except `unsupported`.
          # - minimal: only what librnp needs for RFC 9580 modern OpenPGP
          #            (RSA/ECDSA/ECDH/Ed25519/X25519, AES, SHA-1/2/3,
          #            ChaCha20-Poly1305, GCM, OCB, Argon2, HMAC/HKDF/PBKDF2).
          #            Drops PQC (ML-KEM/ML-DSA/SLH-DSA), Chinese crypto
          #            (SM2/3/4), legacy symmetric (Twofish/Blowfish/CAST5/
          #            Camellia/IDEA/3DES), and rare curves (Ed448/X448).
          if [ "${{ matrix.variant }}" = "minimal" ]; then
            MODULES_FLAG="--minimized-build --enable-modules=aes,sha1,sha2_32,sha2_64,sha3,chacha20poly1305,gcm,ocb,rsa,ecdsa,ecdh,ed25519,x25519,hmac,hkdf,pbkdf2,pgp_s2k,argon2,auto_rng,system_rng,ffi"
          else
            MODULES_FLAG="--disable-modules=unsupported"
          fi

          if [ "${{ matrix.os }}" = "macos" ]; then
            python3 configure.py \
              --prefix=$RUNNER_TEMP/botan-install \
              --with-build-dir=$RUNNER_TEMP/botan-build \
              --link-method=copy \
              --cc=clang --cc-bin=/usr/bin/clang++ \
              --disable-shared-library \
              $MODULES_FLAG
          else
            python3 configure.py \
              --prefix=$RUNNER_TEMP/botan-install \
              --with-build-dir=$RUNNER_TEMP/botan-build \
              --link-method=copy \
              --cc=gcc --cc-bin=g++ \
              --disable-shared-library \
              $MODULES_FLAG
          fi
          make -f $RUNNER_TEMP/botan-build/Makefile -j$(nproc 2>/dev/null || sysctl -n hw.ncpu)
          make -f $RUNNER_TEMP/botan-build/Makefile install
          echo "=== Botan install tree ==="
          find $RUNNER_TEMP/botan-install -maxdepth 3 -type f \( -name "*.a" -o -name "*.so*" -o -name "*.dylib" \)
          du -sh $RUNNER_TEMP/botan-install/lib/libbotan-3.a

      - name: Build json-c (Linux only — macOS uses Homebrew)
        if: matrix.os == 'linux'
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://s3.amazonaws.com/json-c_releases/releases/json-c-0.17.tar.gz
          tar xf json-c-0.17.tar.gz
          cmake -S json-c-0.17 -B json-c-build \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstring" \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/json-c-install
          cmake --build json-c-build --parallel $(nproc)
          cmake --install json-c-build

      - name: Build zlib (static)
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://zlib.net/zlib-1.3.1.tar.gz
          tar xf zlib-1.3.1.tar.gz
          cmake -S zlib-1.3.1 -B zlib-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/zlib-install
          cmake --build zlib-build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install zlib-build

      - name: Build bzip2 (static)
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://sourceware.org/pub/bzip2/bzip2-1.0.8.tar.gz
          tar xf bzip2-1.0.8.tar.gz
          cd bzip2-1.0.8
          # bzip2's Makefile builds a static libbz2.a with `make libbz2.a`.
          # Install manually to a prefix we control.
          make -j$(nproc 2>/dev/null || sysctl -n hw.ncpu) CC="${{ matrix.os == 'macos' && '/usr/bin/clang' || 'gcc' }}" CFLAGS="-O3 -fPIC" libbz2.a bzip2 bzip2recover
          mkdir -p $RUNNER_TEMP/bzip2-install/lib $RUNNER_TEMP/bzip2-install/include
          cp libbz2.a $RUNNER_TEMP/bzip2-install/lib/
          cp bzlib.h $RUNNER_TEMP/bzip2-install/include/

      - name: Build librnp statically
        run: |
          cd $RUNNER_TEMP
          curl -sLO https://github.com/rnpgp/rnp/releases/download/v0.18.1/rnp-v0.18.1.tar.gz
          tar xf rnp-v0.18.1.tar.gz

          BOTAN_PREFIX="$RUNNER_TEMP/botan-install"
          ZLIB_PREFIX="$RUNNER_TEMP/zlib-install"
          BZIP2_PREFIX="$RUNNER_TEMP/bzip2-install"

          if [ "${{ matrix.os }}" = "macos" ]; then
            JSONC_PREFIX="$(brew --prefix json-c)"
            CC=/usr/bin/clang
            CXX=/usr/bin/clang++
          else
            JSONC_PREFIX="$RUNNER_TEMP/json-c-install"
            CC=gcc
            CXX=g++
          fi

          PREFIX_PATH="$BOTAN_PREFIX;$JSONC_PREFIX;$ZLIB_PREFIX;$BZIP2_PREFIX"

          cmake -S rnp-v0.18.1 -B rnp-build \
            -DCMAKE_C_COMPILER=$CC \
            -DCMAKE_CXX_COMPILER=$CXX \
            -DCRYPTO_BACKEND=botan3 \
            -DBUILD_SHARED_LIBS=OFF \
            -DBUILD_TESTING=OFF \
            -DENABLE_DOC=OFF \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-include cstring" \
            -DCMAKE_PREFIX_PATH="$PREFIX_PATH" \
            -DCMAKE_INSTALL_PREFIX=$RUNNER_TEMP/rnp-install
          cmake --build rnp-build --parallel $(nproc 2>/dev/null || sysctl -n hw.ncpu)
          cmake --install rnp-build

      - name: Collect artifacts
        run: |
          TARGET=${{ matrix.target }}
          VARIANT=${{ matrix.variant }}
          # Layout: prebuilt/<target>/ for full, prebuilt/<target>-minimal/ for minimal.
          if [ "$VARIANT" = "minimal" ]; then
            DEST="prebuilt/$TARGET-minimal"
          else
            DEST="prebuilt/$TARGET"
          fi
          mkdir -p $DEST/lib $DEST/include/rnp

          cp $RUNNER_TEMP/rnp-install/lib/librnp.a $DEST/lib/
          cp $RUNNER_TEMP/rnp-install/lib/libsexpp.a $DEST/lib/

          if [ "${{ matrix.os }}" = "macos" ]; then
            cp $(brew --prefix json-c)/lib/libjson-c.a $DEST/lib/
          else
            cp $RUNNER_TEMP/json-c-install/lib/libjson-c.a $DEST/lib/
          fi

          # Bundle the static Botan library so consumers don't need a system Botan install.
          cp $RUNNER_TEMP/botan-install/lib/libbotan-3.a $DEST/lib/

          # Bundle zlib and bzip2 statically too — fully self-contained builds.
          cp $RUNNER_TEMP/zlib-install/lib/libz.a $DEST/lib/
          cp $RUNNER_TEMP/bzip2-install/lib/libbz2.a $DEST/lib/

          cp $RUNNER_TEMP/rnp-install/include/rnp/*.h $DEST/include/rnp/

          echo "=== $DEST ==="
          find $DEST -type f
          du -sh $DEST/lib/*.a

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: prebuilt-${{ matrix.target }}-${{ matrix.variant }}
          path: prebuilt/${{ matrix.variant == 'minimal' && format('{0}-minimal', matrix.target) || matrix.target }}/

  commit:
    name: Commit prebuilt libs
    needs: build
    runs-on: ubuntu-latest
    if: always()
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: prebuilt-downloads
          pattern: prebuilt-*
          merge-multiple: false

      - name: Assemble prebuilt directory
        run: |
          # Artifact names: prebuilt-<target>-<variant>
          # Map back to prebuilt/<target> or prebuilt/<target>-minimal
          for dir in prebuilt-downloads/prebuilt-*; do
            name=$(basename "$dir")
            # Strip "prebuilt-" prefix, then split target from variant on the last dash.
            rest="${name#prebuilt-}"
            target="${rest%-*}"
            variant="${rest##*-}"
            if [ "$variant" = "minimal" ]; then
              target_dir="prebuilt/$target-minimal"
            else
              target_dir="prebuilt/$target"
            fi
            rm -rf "$target_dir"
            mkdir -p "$target_dir"
            cp -r "$dir"/* "$target_dir/"
          done
          echo "=== All prebuilt targets ==="
          find prebuilt -type f | sort

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b chore/prebuilt-update
          git add prebuilt/
          git diff --staged --quiet && echo "No changes" && exit 0
          git commit -m "chore: update prebuilt static libraries for all platforms

          Targets: $(ls prebuilt/ | tr '\n' ' ')"
          git push --force-with-lease origin chore/prebuilt-update

      - name: Open or update PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_EXISTS=$(gh pr list --head chore/prebuilt-update --state open --json number --jq 'length')
          if [ "$PR_EXISTS" = "0" ]; then
            gh pr create \
              --title "chore: update prebuilt static libraries for all platforms" \
              --body "Pre-built static librnp + Botan + json-c + zlib + bzip2 for all supported targets and both variants (full + minimal). Built via the prebuild-static-libs workflow." \
              --base main \
              --head chore/prebuilt-update
          else
            echo "PR already exists"
          fi
