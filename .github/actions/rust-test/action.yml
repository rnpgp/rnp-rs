# Reusable composite action: install toolchain → build librnp →
# cargo build/test. Used by bench, beta, nightly, miri.
#
# Caller MUST run `actions/checkout@v7` before this action — GitHub
# needs to find .github/actions/install-librnp on disk before it can
# resolve the local-action reference below.
#
# Why a composite action, not a reusable workflow:
# composite actions compose more naturally with per-job setup and can
# be called multiple times in the same job. Reusable workflows are
# heavier and require separate triggers.
name: Run Rust build/test against a locally-built librnp

inputs:
  toolchain:
    description: Rust toolchain channel (stable, beta, nightly, 1.88.0)
    required: true
  components:
    description: Comma-separated components to install (clippy, miri, rustfmt, ...)
    required: false
    default: ""
  command:
    description: cargo subcommand to run (build, test, bench, clippy, miri test)
    required: false
    default: "test"
  extra-args:
    description: Extra args appended after `cargo <command>` (e.g. --features ...).
    required: false
    default: ""
  env-vars:
    description: |
      Multiline `KEY=value` pairs written to GITHUB_ENV before the cargo
      command runs. Useful for things like MIRIFLAGS that the test
      process must see.
    required: false
    default: ""
  pre-setup:
    description: Multiline shell script run after install-librnp, before cargo.
    required: false
    default: ""
  post-commands:
    description: |
      Multiline shell script run after the main cargo command. Always
      runs with continue-on-error so it can be a smoke-test / sanity
      check that doesn't fail the job.
    required: false
    default: ""
  allow-failure:
    description: If "true", treat non-zero exit on the main cargo command as warning.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: ${{ inputs.toolchain }}
        components: ${{ inputs.components }}

    - name: Install librnp
      uses: ./.github/actions/install-librnp

    - uses: actions/cache@v6
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: rust-test-${{ inputs.toolchain }}-${{ hashFiles('Cargo.lock') }}

    - name: Pre-setup
      if: inputs.pre-setup != ''
      shell: bash
      run: ${{ inputs.pre-setup }}

    - name: Set env vars
      if: inputs.env-vars != ''
      shell: bash
      run: |
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          echo "$line" >> "$GITHUB_ENV"
        done <<< "${{ inputs.env-vars }}"

    - name: cargo ${{ inputs.command }}
      shell: bash
      continue-on-error: ${{ inputs.allow-failure == 'true' }}
      run: cargo ${{ inputs.command }} ${{ inputs.extra-args }} --no-fail-fast

    - name: Post-commands
      if: inputs.post-commands != '' && always()
      shell: bash
      continue-on-error: true
      run: ${{ inputs.post-commands }}
