name: Build librnp via rnp-src and export paths
description: |
  Uses `cargo build --features vendored` to build librnp 0.18.1 + Botan 3.12
  + json-c + zlib + bzip2 from source via the rnp-src crate (which uses
  botan-src internally). Exports RNP_INCLUDE_DIR / RNP_LIB_DIR so rnp-rs's
  build.rs can find the built libraries.
  No manual curl/tar/configure — everything goes through the Rust build pipeline.

runs:
  using: composite
  steps:
    - name: Install build deps (Linux)
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake build-essential python3 curl

    - name: Install build deps (macOS)
      if: runner.os == 'macOS'
      shell: bash
      run: brew install cmake python3

    - name: Build librnp + Botan via rnp-src
      shell: bash
      run: |
        # Trigger rnp-src's build.rs by building the crate. botan-src,
        # json-c, zlib, bzip2, and librnp 0.18.1 are all compiled from
        # source into OUT_DIR. We then locate the install prefix.
        cargo build -p rnp-src

    - name: Export librnp paths
      shell: bash
      run: |
        # rnp-src installs to OUT_DIR/install/{rnp,botan,json-c,zlib,bzip2}/
        # OUT_DIR is target/debug/build/rnp-src-<hash>/out
        OUT_DIR=$(ls -d target/debug/build/rnp-src-*/out 2>/dev/null | head -1)
        if [ -z "$OUT_DIR" ] || [ ! -d "$OUT_DIR/install/rnp" ]; then
          echo "ERROR: rnp-src build output not found" >&2
          echo "Searched: target/debug/build/rnp-src-*/out" >&2
          ls -la target/debug/build/ | grep rnp-src >&2 || true
          exit 1
        fi
        echo "RNP_INCLUDE_DIR=$OUT_DIR/install/rnp/include" >> $GITHUB_ENV
        echo "RNP_LIB_DIR=$OUT_DIR/install/rnp/lib" >> $GITHUB_ENV
        # Per-dep lib dirs for the linker
        echo "DEP_RNP_BOTAN_LIB_DIR=$OUT_DIR/install/botan/lib" >> $GITHUB_ENV
        echo "DEP_RNP_JSONC_LIB_DIR=$OUT_DIR/install/json-c/lib" >> $GITHUB_ENV
        echo "DEP_RNP_ZLIB_LIB_DIR=$OUT_DIR/install/zlib/lib" >> $GITHUB_ENV
        echo "DEP_RNP_BZIP2_LIB_DIR=$OUT_DIR/install/bzip2/lib" >> $GITHUB_ENV
        echo "Found rnp-src output at: $OUT_DIR"
