[package]
name = "rnp-src"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Build scripts for compiling librnp from source"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
links = "rnp"

[features]
default = ["botan-3-12"]
# Default Botan: latest (3.12). Works for non-PQC builds against librnp 0.18.1.
botan-3-12 = ["dep:botan-src"]
# Compat Botan: 3.7.1 (pre-EC API drift). Required for PQC + crypto-refresh
# because librnp 0.18.1's `src/lib/crypto/ec.cpp` references Botan::EC_Group
# / EC_Point by value, which Botan 3.11+ made opaque (PIMPL).
botan-3-7 = ["dep:botan-src-compat"]
# Build librnp with ENABLE_PQC=ON and Botan with PQC modules enabled.
# Forces the compat (3.7.1) Botan for API compatibility with librnp 0.18.1.
pqc = ["botan-3-7", "crypto-refresh"]
# Build librnp with ENABLE_CRYPTO_REFRESH=ON. Also forces compat Botan
# for the same reason as `pqc`.
crypto-refresh = ["botan-3-7"]

[build-dependencies]
# Default Botan (latest) — non-optional under default features.
botan-src = { version = "0.31200", optional = true }
# Compat Botan (older API) — pulled in only when pqc/crypto-refresh is on.
botan-src-compat = { package = "botan-src", version = "0.30701", optional = true }
cmake = "0.1"
