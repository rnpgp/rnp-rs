[package]
name = "rnp-src"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Build scripts for compiling librnp from source"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
links = "rnp"

[features]
default = []
# Build librnp with ENABLE_PQC=ON and Botan with PQC modules enabled.
# PQC + crypto-refresh code paths in librnp 0.18.1 are incompatible with
# Botan 3.12's opaque EC_Group/EC_Point API; when this feature is on,
# rnp-src clones librnp HEAD (which has the fixes) instead of using the
# 0.18.1 release tarball.
pqc = ["crypto-refresh"]
# Build librnp with ENABLE_CRYPTO_REFRESH=ON. Same HEAD-vs-0.18.1
# reasoning as `pqc`.
crypto-refresh = []
# Diagnostic: pull in botan-sys so its links metadata becomes visible to
# our build script. When another crate in the graph enables
# botan-sys/vendored (e.g. the `botan` crate), Botan is compiled twice
# (once by botan-sys, once by rnp-src) — emit a loud warning instead of
# failing silently at link time. Requires a system Botan OR a vendored
# botan elsewhere in the graph (botan-sys's non-vendored build script
# probes for a system install).
botan-sys-detect = ["dep:botan-sys"]

[build-dependencies]
# Exact pin: 0.31300.1 switched the Windows build step to `nmake` (MSVC),
# which does not exist under MSYS2/mingw — the toolchain our Windows CI and
# users use. 0.31300.0 invokes plain `make` everywhere. Unpin once botan-rs
# picks nmake only for MSVC-style toolchains.
botan-src = "=0.31300.0"
# Optional, only with the `botan-sys-detect` feature. Exact-pin follows
# the same botan-src as above so a detected graph shares one Botan version.
botan-sys = { version = "1.20260811", optional = true, features = [] }
cmake = "0.1"
# Pure-Rust HTTP + tarball extraction so we don't depend on the system
# having curl + tar in PATH (Windows runners don't always have curl).
flate2 = "1"
tar = "0.4"
# Latest ureq (3.x). Default features include TLS (rustls) so HTTPS works
# — required because all rnp-src's download URLs are https://. In 3.x the
# body is read via `res.body_mut().as_reader()` (the older
# `res.into_reader()` was removed).
ureq = "3"
