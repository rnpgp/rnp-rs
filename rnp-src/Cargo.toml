[package]
name = "rnp-src"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Build scripts for compiling librnp from source"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
links = "rnp"

[features]
default = []
# Build librnp with ENABLE_PQC=ON and Botan with PQC modules enabled.
# Consumed by rnp-rs's `pqc` feature; surfaced as `cfg(feature = "pqc")`
# in this build script.
pqc = []
# Build librnp with ENABLE_CRYPTO_REFRESH=ON.
crypto-refresh = []

[dependencies]
botan-src = "0.31200.0"

[build-dependencies]
botan-src = "0.31200.0"
cmake = "0.1"
