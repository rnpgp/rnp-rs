[package]
name = "rnp-src"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Build scripts for compiling librnp from source"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
links = "rnp"

[features]
default = []
# When enabled, build.rs compiles Botan + json-c + zlib + bzip2 + librnp
# from source. Off by default so that `cargo publish --verify` (which
# runs build.rs without consumer features) doesn't trigger the 10+ min
# Botan compilation. rnp-rs enables this when its `vendored` feature is on.
compile = ["dep:botan-src", "dep:cmake"]

[dependencies]
botan-src = { version = "0.31200.0", optional = true }

[build-dependencies]
botan-src = { version = "0.31200.0", optional = true }
cmake = { version = "0.1", optional = true }
