[package]
name = "rnp-rs"
version = "0.1.7"
edition = "2024"
rust-version = "1.88"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Idiomatic Rust binding to the RNP OpenPGP C FFI (librnp)"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
documentation = "https://docs.rs/rnp-rs"
readme = "README.md"
keywords = ["openpgp", "pgp", "rnp", "crypto", "cryptography"]
categories = ["api-bindings", "cryptography"]
include = [
    "src/**/*.rs",
    "build.rs",
    "wrapper.h",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE.md",
    "prebuilt/**/*.a",
    "prebuilt/**/*.h",
    "vendor/rnp/CMakeLists.txt",
    "vendor/rnp/src/lib/CMakeLists.txt",
    "vendor/README.md",
]

[package.metadata.docs.rs]
# Build with all features so the PQC + crypto-refresh API surface appears
# in the rendered docs. docs.rs ignores features whose build deps aren't
# available, so this won't fail the doc build.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
snafu = "0.8"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "compression-deflate", "allow-experimental-crypto", "allow-variable-time-crypto"] }
rnp-sexp = "0.1"

[[bench]]
name = "sign_verify"
harness = false

[[bench]]
name = "encrypt_decrypt"
harness = false

[[bench]]
name = "keygen"
harness = false

[features]
default = []
# Build librnp from a vendored git submodule of the `rnp` C++ project. See
# TODO.roadmap/10-vendored-build.md.
vendored = []
# Implies `vendored`. Selects the minimal prebuilt variant — Botan built
# with --minimized-build, only the algorithms required for modern RFC 9580
# OpenPGP (RSA, ECDSA, ECDH, Ed25519, X25519, AES, SHA-1/2/3,
# ChaCha20-Poly1305, GCM, OCB, Argon2, HMAC/HKDF/PBKDF2). Drops PQC,
# Chinese crypto (SM2/3/4), legacy symmetric ciphers (Twofish/Blowfish/
# CAST5/Camellia/IDEA/3DES), and rare curves (Ed448/X448). Incompatible
# with the `pqc` feature (build.rs emits a compile_error!).
vendored-minimal = ["vendored"]
# Implies `vendored`. Switches the backend from Botan to OpenSSL 3.x.
# Picks prebuilt/<target>-openssl3/ (or prebuilt/<target>-openssl3-minimal/
# if combined with vendored-minimal, though minimal-openssl isn't currently
# built). Incompatible with `pqc` (OpenSSL has no PQC support).
vendored-openssl3 = ["vendored"]
# Implies `vendored` AND `pqc`. Selects the PQC-enabled Botan+librnp
# prebuilt: Botan built with ML-KEM/ML-DSA/SLH-DSA modules, librnp built
# with -DENABLE_PQC=ON and -DENABLE_CRYPTO_REFRESH=ON. Use this when you
# want PQC algorithms (ML-KEM, ML-DSA, SLH-DSA) and crypto-refresh (v6
# keys, v6 PKESK/SKESK). The largest variant.
vendored-pqc = ["vendored", "pqc", "crypto-refresh"]
# Pass -DRNP_EXPERIMENTAL_PQC to bindgen so the PQC algorithm constants and
# `rnp_op_encrypt_prefer_pqc_enc_subkey` are picked up. Requires the linked
# librnp to have been built with ENABLE_PQC=ON (Botan 3 + ENABLE_PQC).
pqc = []
# Pass -DRNP_EXPERIMENTAL_CRYPTO_REFRESH to bindgen so v6 keys
# (`rnp_op_generate_set_v6_key`), crypto-refresh algorithm names, and
# enable_pkesk_v6 / enable_skesk_v6 are exposed. Requires the linked
# librnp to have been built with ENABLE_CRYPTO_REFRESH=ON.
crypto-refresh = []
# Enable `Context::set_log_fd` / `set_log_file` for directing librnp's
# diagnostic output to a file. Off by default because most consumers
# don't need it.
logging = []
# Pull in sequoia-openpgp for cross-validation tests in `tests/`
# (interop round-trips with the Rust reference OpenPGP implementation).
# Off by default to keep the default test matrix fast.
cross-validation = []

[lib]
name = "rnp"
# The bindgen-generated FFI bindings carry the upstream C API doc comments,
# many of which contain fenced code blocks that the doctest harness tries to
# compile as standalone programs. Those snippets are C/JSON, not Rust, so we
# disable doctests on the crate.
doctest = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
