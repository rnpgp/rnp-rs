[package]
name = "rnp"
version = "0.1.2"
edition = "2024"
rust-version = "1.85"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Idiomatic Rust binding to the RNP OpenPGP C FFI (librnp)"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
documentation = "https://docs.rs/rnp"
readme = "README.adoc"
keywords = ["openpgp", "pgp", "rnp", "crypto", "cryptography"]
categories = ["api-bindings", "cryptography"]
include = [
    "src/**/*.rs",
    "build.rs",
    "wrapper.h",
    "Cargo.toml",
    "Cargo.lock",
    "README.adoc",
    "LICENSE.md",
    "vendor/rnp/CMakeLists.txt",
    "vendor/rnp/src/lib/CMakeLists.txt",
    "vendor/README.md",
]

[dependencies]
snafu = "0.8"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "compression-deflate", "allow-experimental-crypto", "allow-variable-time-crypto"] }

[[bench]]
name = "sign_verify"
harness = false

[[bench]]
name = "encrypt_decrypt"
harness = false

[[bench]]
name = "keygen"
harness = false

[features]
default = []
# Build librnp from a vendored git submodule of the `rnp` C++ project. See
# TODO.roadmap/10-vendored-build.md.
vendored = []
# Pass -DRNP_EXPERIMENTAL_PQC to bindgen so the PQC algorithm constants and
# `rnp_op_encrypt_prefer_pqc_enc_subkey` are picked up. Requires the linked
# librnp to have been built with ENABLE_PQC=ON (Botan 3 + ENABLE_PQC).
pqc = []
# Pass -DRNP_EXPERIMENTAL_CRYPTO_REFRESH to bindgen so v6 keys
# (`rnp_op_generate_set_v6_key`), crypto-refresh algorithm names, and
# enable_pkesk_v6 / enable_skesk_v6 are exposed. Requires the linked
# librnp to have been built with ENABLE_CRYPTO_REFRESH=ON.
crypto-refresh = []
# Enable `Context::set_log_fd` / `set_log_file` for directing librnp's
# diagnostic output to a file. Off by default because most consumers
# don't need it.
logging = []
# Pull in sequoia-openpgp for cross-validation tests in `tests/`
# (interop round-trips with the Rust reference OpenPGP implementation).
# Off by default to keep the default test matrix fast.
cross-validation = []

[lib]
# The bindgen-generated FFI bindings carry the upstream C API doc comments,
# many of which contain fenced code blocks that the doctest harness tries to
# compile as standalone programs. Those snippets are C/JSON, not Rust, so we
# disable doctests on the crate.
doctest = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
