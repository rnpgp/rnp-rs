[package]
name = "rnp-rs"
version = "0.1.9"
edition = "2024"
rust-version = "1.88"
authors = ["Ribose Inc. <open.source@ribose.com>"]
license = "BSD-2-Clause"
description = "Idiomatic Rust binding to the RNP OpenPGP C FFI (librnp)"
repository = "https://github.com/rnpgp/rnp-rs"
homepage = "https://github.com/rnpgp/rnp-rs"
documentation = "https://docs.rs/rnp-rs"
readme = "README.md"
keywords = ["openpgp", "pgp", "rnp", "crypto", "cryptography"]
categories = ["api-bindings", "cryptography"]
include = [
    "src/**/*.rs",
    "build.rs",
    "wrapper.h",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE.md",
]

[package.metadata.docs.rs]
# Build with all features so the PQC + crypto-refresh API surface appears
# in the rendered docs. docs.rs ignores features whose build deps aren't
# available, so this won't fail the doc build.
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
snafu = "0.8"

[build-dependencies]
bindgen = "0.72"
cmake = "0.1"

[dev-dependencies]
proptest = "1"
criterion = "0.5"
sequoia-openpgp = { version = "2", default-features = false, features = ["crypto-rust", "compression-deflate", "allow-experimental-crypto", "allow-variable-time-crypto"] }
rnp-sexp = "0.1"

[[bench]]
name = "sign_verify"
harness = false

[[bench]]
name = "encrypt_decrypt"
harness = false

[[bench]]
name = "keygen"
harness = false

[features]
default = []
# Download + compile librnp and all dependencies (Botan, json-c, zlib,
# bzip2) from source at build time. Fully self-contained — no system
# librnp/Botan needed. First build takes ~10 min; cached in OUT_DIR
# after that. Requires: C/C++ compiler, cmake, python3, curl, tar.
vendored = []
# Implies `vendored`. Builds Botan with a reduced module set (drops
# PQC, SM2/3/4, legacy ciphers, TLS). Faster compile, smaller binary.
# Incompatible with `pqc`.
vendored-minimal = ["vendored"]
# Pass -DRNP_EXPERIMENTAL_PQC to bindgen so PQC algorithm constants
# are exposed. When combined with `vendored`, also builds librnp with
# ENABLE_PQC=ON.
pqc = []
# Pass -DRNP_EXPERIMENTAL_CRYPTO_REFRESH to bindgen so v6 keys and
# crypto-refresh features are exposed. When combined with `vendored`,
# also builds librnp with ENABLE_CRYPTO_REFRESH=ON.
crypto-refresh = []
# Enable `Context::set_log_fd` / `set_log_file`.
logging = []
# Pull in sequoia-openpgp for cross-validation tests.
cross-validation = []

[lib]
name = "rnp"
# The bindgen-generated FFI bindings carry the upstream C API doc comments,
# many of which contain fenced code blocks that the doctest harness tries to
# compile as standalone programs. Those snippets are C/JSON, not Rust, so we
# disable doctests on the crate.
doctest = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
