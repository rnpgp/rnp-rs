# release-plz configuration for rnp-rs
#
# Auto-bumps version + regenerates CHANGELOG when conventional-commit
# prefixes (feat:, fix:, etc.) land on main. The release PR is opened
# automatically; merging it publishes to crates.io.
#
# See: https://release-plz.dev/docs/config

[workspace]
git_release_enable = false
dependencies_update = true
# Publishing is handled by .github/workflows/publish.yml via crates.io
# trusted publishing (GitHub Actions OIDC) — no long-lived token here.
publish = false

# Changelog configuration.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""
