# release-plz configuration for rnp-rs
#
# Auto-bumps version + regenerates CHANGELOG when conventional-commit
# prefixes (feat:, fix:, etc.) land on main. The release PR is opened
# automatically; merging it publishes to crates.io.
#
# See: https://release-plz.dev/docs/config

[workspace]
# Detect all workspace members automatically.
git_release_enable = false
dependencies_update = true

# rnp-src is published manually in release.yml with --no-verify because
# its build.rs compiles Botan (10+ min) which cargo's verification step
# can't handle. release-plz only manages rnp-rs.
[[package]]
name = "rnp-src"
publish = false

# Changelog configuration.
[changelog]
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}\
{% if commit.breaking %} (BREAKING){% endif %}\
{% if commit.author != "github-actions[bot]" %} by @{{ commit.author }}{% endif %}\
{% endfor %}
{% endfor %}
"""

# Commit-message conventions:
# - feat: minor version bump
# - fix: patch version bump
# - feat! or fix!: major version bump (breaking change)
# - docs, chore, refactor, test: no version bump (changelog entry only)
