# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/index.html

[advisories]
# Security advisories from RustSec
version = 2
# rsa 0.9.10 (transitive via sequoia-openpgp, a dev-only dependency
# used for cross-validation tests) has RUSTSEC-2023-0071 (Marvin
# Attack). No safe upgrade is available upstream as of 2026-07; the
# issue is not exploitable in our test paths because we never use rsa
# for security-sensitive operations — sequoia is purely a sanity-check
# oracle. Re-evaluate when RustCrypto/RSA cuts a fixed release.
ignore = [
    { id = "RUSTSEC-2023-0071", reason = "rsa via sequoia-openpgp (dev-only); no safe upgrade; not on a sensitive path" }
]

[licenses]
version = 2

# Allow these licenses
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "CC0-1.0",
]

# Confidence threshold for license detection
confidence-threshold = 0.8

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"
# Lint level for wildcard dependencies
wildcards = "warn"
# Highlight crates with duplicate versions
highlight = "all"

# Deny specific crates
deny = [
    # { name = "ansi_term", version = "*" },
]

[sources]
# Lint level for crates from unknown registries
unknown-registry = "warn"
# Lint level for crates from unknown git sources
unknown-git = "warn"
# Allow specific registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Allow specific git sources
allow-git = []
